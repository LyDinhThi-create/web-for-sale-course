<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account Settings</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        min-height: 100vh;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        background: white;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        overflow: hidden;
      }

      .header {
        background: #ddd;
        color: black;
        padding: 30px;
        text-align: center;
      }

      .header h1 {
        font-size: 32px;
        margin-bottom: 10px;
      }

      .header p {
        opacity: 0.9;
        font-size: 16px;
      }

      .tabs {
        display: flex;
        background: #f8f9fa;
        border-bottom: 2px solid #e9ecef;
      }

      .tab {
        flex: 1;
        padding: 20px;
        text-align: center;
        cursor: pointer;
        background: transparent;
        border: none;
        font-size: 16px;
        font-weight: 600;
        color: #6c757d;
        transition: all 0.3s;
        position: relative;
      }

      .tab:hover {
        background: rgba(102, 126, 234, 0.1);
        color: #667eea;
      }

      .tab.active {
        color: #667eea;
      }

      .tab.active::after {
        content: "";
        position: absolute;
        bottom: -2px;
        left: 0;
        width: 100%;
        height: 3px;
        background: #667eea;
      }

      .content {
        padding: 40px;
      }

      .tab-content {
        display: none;
        animation: fadeIn 0.5s;
      }

      .tab-content.active {
        display: block;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .form-group {
        margin-bottom: 25px;
      }
      .form-group.checkbox {
        width: fit-content;
      }
      .form-group.checkbox input {
        width: auto;
        margin-left: 0;
      }

      .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #333;
        font-weight: 600;
        font-size: 14px;
      }

      .form-group input,
      .form-group textarea,
      .form-group select {
        width: 100%;
        padding: 12px 15px;
        border: 2px solid #e9ecef;
        border-radius: 10px;
        font-size: 15px;
        transition: all 0.3s;
      }

      .form-group input:focus,
      .form-group textarea:focus,
      .form-group select:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      .form-group textarea {
        resize: vertical;
        min-height: 100px;
      }

      .avatar-section {
        text-align: center;
        margin-bottom: 30px;
      }

      .avatar {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        margin: 0 auto 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 48px;
        color: white;
        font-weight: bold;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      }

      .btn {
        padding: 12px 30px;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
      }

      .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
      }

      .btn-secondary {
        background: #e9ecef;
        color: #495057;
        margin-left: 10px;
      }

      .btn-secondary:hover {
        background: #dee2e6;
      }

      .password-requirements {
        background: #f8f9fa;
        padding: 15px;
        border-radius: 10px;
        margin-top: 20px;
      }

      .password-requirements h4 {
        color: #495057;
        margin-bottom: 10px;
        font-size: 14px;
      }

      .password-requirements ul {
        list-style: none;
        padding-left: 0;
      }

      .password-requirements li {
        color: #6c757d;
        padding: 5px 0;
        font-size: 13px;
      }

      .password-requirements li::before {
        content: "✓ ";
        color: #28a745;
        font-weight: bold;
        margin-right: 5px;
      }

      .alert {
        padding: 15px 20px;
        border-radius: 10px;
        margin-bottom: 20px;
        display: none;
      }

      .alert.show {
        display: block;
        animation: slideDown 0.3s;
      }

      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .alert-success {
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }

      .alert-danger {
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }

      .two-column {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }

      @media (max-width: 768px) {
        .two-column {
          grid-template-columns: 1fr;
        }

        .tabs {
          flex-direction: column;
        }

        .content {
          padding: 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Cài đặt tài khoản</h1>
        <p>Quản lý thông tin cá nhân và bảo mật của bạn</p>
      </div>

      <div class="tabs">
        <button class="tab active" onclick="switchTab('profile')">
          Thông tin cá nhân
        </button>
        <button class="tab" onclick="switchTab('security')">Bảo mật</button>
      </div>

      <div class="content">
        <div id="alert-success" class="alert alert-success"></div>
        <div id="alert-danger" class="alert alert-danger"></div>

        <!-- Profile Tab -->
        <div id="profile" class="tab-content active">
          <div class="avatar-section">
            <div class="avatar">ND</div>
            <button class="btn btn-secondary">Thay đổi ảnh đại diện</button>
          </div>

          <form id="profileForm">
            <div class="two-column">
              <div class="form-group">
                <label>Họ</label>
                <input type="text" id="firstName" value="Nguyễn" required />
              </div>
              <div class="form-group">
                <label>Tên</label>
                <input type="text" id="lastName" value="Dũng" required />
              </div>
            </div>

            <div class="form-group">
              <label>Email</label>
              <input
                type="email"
                id="email"
                value="nguyen.dung@example.com"
                required
              />
            </div>

            <div class="form-group">
              <label>Số điện thoại</label>
              <input type="tel" id="phone" value="0123456789" />
            </div>

            <div class="form-group checkbox">
              <label> Nhận thông báo qua email </label>
              <input type="checkbox" id="emailNotifications" checked />
            </div>

            <div class="form-group checkbox">
              <label> Nhận email khuyến mãi </label>
              <input type="checkbox" id="marketingEmails" />
            </div>

            <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
            <button
              type="button"
              class="btn btn-secondary"
              onclick="resetForm('profileForm')"
            >
              Hủy
            </button>
          </form>
        </div>

        <!-- Security Tab -->
        <div id="security" class="tab-content">
          <h2 style="margin-bottom: 30px; color: #333">Đổi mật khẩu</h2>

          <form id="passwordForm">
            <div class="form-group">
              <label>Mật khẩu hiện tại</label>
              <input type="password" id="currentPassword" required />
            </div>

            <div class="form-group">
              <label>Mật khẩu mới</label>
              <input type="password" id="newPassword" required />
            </div>

            <div class="form-group">
              <label>Xác nhận mật khẩu mới</label>
              <input type="password" id="confirmPassword" required />
            </div>

            <div class="password-requirements">
              <h4>Yêu cầu mật khẩu:</h4>
              <ul>
                <li>Tối thiểu 8 ký tự</li>
                <li>Ít nhất một chữ hoa</li>
                <li>Ít nhất một chữ thường</li>
                <li>Ít nhất một số</li>
                <li>Ít nhất một ký tự đặc biệt (@$!%*?&)</li>
              </ul>
            </div>

            <button
              type="submit"
              class="btn btn-primary"
              style="margin-top: 20px"
            >
              Đổi mật khẩu
            </button>
            <button
              type="button"
              class="btn btn-secondary"
              onclick="resetForm('passwordForm')"
            >
              Hủy
            </button>
          </form>
        </div>
      </div>
    </div>

    <script>
      function switchTab(tabName) {
        // Hide all tab contents
        const contents = document.querySelectorAll(".tab-content");
        contents.forEach((content) => content.classList.remove("active"));

        // Remove active class from all tabs
        const tabs = document.querySelectorAll(".tab");
        tabs.forEach((tab) => tab.classList.remove("active"));

        // Show selected tab content
        document.getElementById(tabName).classList.add("active");

        // Add active class to clicked tab
        event.target.classList.add("active");
      }

      function showAlert(message, type) {
        const alertId = type === "success" ? "alert-success" : "alert-danger";
        const alert = document.getElementById(alertId);
        alert.textContent = message;
        alert.classList.add("show");

        setTimeout(() => {
          alert.classList.remove("show");
        }, 3000);
      }

      function resetForm(formId) {
        document.getElementById(formId).reset();
      }

      // Profile Form Submit
      document
        .getElementById("profileForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const firstName = document.getElementById("firstName").value;
          const lastName = document.getElementById("lastName").value;
          const email = document.getElementById("email").value;

          // Simulate saving
          setTimeout(() => {
            showAlert("Thông tin đã được cập nhật thành công!", "success");

            // Update avatar
            const avatar = document.querySelector(".avatar");
            avatar.textContent = firstName.charAt(0) + lastName.charAt(0);
          }, 500);
        });
    </script>
  </body>
</html>
