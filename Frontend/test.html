<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    header {
      height: 10vh;
      background-color: lightgray;
    }
    section {
      display: flex;
    }
    .menu {
      flex: 1;
      height: 80px;
      background-color: lightblue;
    }
    .card {
      padding: 20px;
    }
    .img_card {
      float: left;
    }
    .content {
      flex: 2;
      height: 80px;
    }
    .register {
      flex: 1;
      height: 80px;
      background-color: lightcoral;
    }
    footer {
      height: 10vh;
      background-color: lightgray;
    }
    .img_container {
      width: 100px;
      height: 100px;
      overflow: hidden;
      border: 1px solid #000;
    }
    .img_card {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: 0.3s;
    }
    .img_card:hover {
      transform: scale(1.2);
    }
  </style>
  <body>
    <main>
      <div>
        <div class="img_container">
          <img
            class="img_card"
            src="./img/about-img12.png"
            alt="Placeholder Image"
          />
        </div>
      </div>
    </main>
    <footer></footer>
    <script>
      var word = "Hello,           World!";
      var words = word.split(/\s+/);
      console.log(words);
    </script>
  </body>
</html>
